readout cx=640 cy=345 w=1150 h=44 label="" key=help_1
readout cx=640 cy=440 w=1150 h=44 label="" key=help_2
readout cx=640 cy=495 w=1150 h=44 label="" key=help_3
readout cx=640 cy=550 w=1150 h=44 label="" key=help_4
readout cx=640 cy=650 w=1150 h=40 label="" key=help_5
qlinks "SETUP" = clock,glide,quant,master
