# Decks MPC skin layout. Deck A left, deck B right (as in Mixxx), the mixer in the middle.
# The skin cannot draw a waveform (no live images on MPC skins, docs/NOTES.md of
# mpc-vst-plugins): title, tempo, time and a position bar with the bar/beat counter are
# readouts, i.e. parameters whose value text the plugin writes. Lists (tracks, folders) are
# `list` rows: tap = select (tracks) or open (folders); the TRACK and FOLDER knobs select
# across the whole list (the rows page along), LOAD A/B and OPEN act on the selection.
# Small text is never baked into the background (the pixel font is unreadable on the device):
# explanations are readouts, choices are popups.
# Q-Links: knobs only, never buttons. DECKS: 1 PITCH A, 2 NUDGE A, 3 VOL A, 4 XFADE,
# 5 VOL B, 6 NUDGE B, 7 PITCH B, 8 MASTER - mirrored like a DJ mixer.
# Palette: black panel, warm white print, amber accents (vinyl and VU).
style=td3
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.25
theme_bg=141414
theme_panel=222222
theme_line=0c0c0c
theme_ink=f2eee6
theme_ink_dim=b3ada2
theme_ink_faint=5f5a52
theme_accent=f0a020
theme_accent_hi=ffc85a
theme_knob_face=0c0c0c
theme_knob_ring=000000
theme_bar=f0a020
theme_seg_active=f0a020
theme_seg_inactive=0c0c0c
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0a0a0a
theme_knob_off=4f4b45
theme_tab_on=f0a020
theme_tab_on_tx=111111
theme_lcd=1a1408
theme_box=1a1a1a
theme_btn_bg=f2eee6
theme_chrome_ink=f2eee6
theme_go_on=f0a020
theme_go_off=ffc85a
theme_tabs=f0a020
qlinks_track = pitch_a,nudge_a,vol_a,xfade,vol_b,nudge_b,pitch_b,master

[tab DECKS]
frame x=36 y=88 w=1207 h=624 title=""
readout cx=332 cy=128 w=560 h=44 label="" key=title_a
readout cx=332 cy=176 w=560 h=40 label="" key=info_a
readout cx=332 cy=222 w=560 h=40 label="" key=bar_a
readout cx=948 cy=128 w=560 h=44 label="" key=title_b
readout cx=948 cy=176 w=560 h=40 label="" key=info_b
readout cx=948 cy=222 w=560 h=40 label="" key=bar_b
button cx=130 cy=360 label="  PLAY A  " key=play_a
button cx=300 cy=360 label="  CUE A  " key=cue_a
text cx=490 cy=318 label="SYNC A" size=2.2
toggle cx=490 cy=370 label="" key=sync_a
knob cx=640 cy=360 r=44 label="MASTER" key=master
text cx=790 cy=318 label="SYNC B" size=2.2
toggle cx=790 cy=370 label="" key=sync_b
button cx=980 cy=360 label="  CUE B  " key=cue_b
button cx=1150 cy=360 label="  PLAY B  " key=play_b
knob cx=130 cy=560 r=44 label="PITCH A" key=pitch_a
knob cx=300 cy=560 r=44 label="NUDGE A" key=nudge_a
knob cx=490 cy=560 r=44 label="VOL A" key=vol_a
knob cx=640 cy=560 r=44 label="X-FADE" key=xfade
knob cx=790 cy=560 r=44 label="VOL B" key=vol_b
knob cx=980 cy=560 r=44 label="NUDGE B" key=nudge_b
knob cx=1150 cy=560 r=44 label="PITCH B" key=pitch_b
qlinks "DECKS" = pitch_a,nudge_a,vol_a,xfade,vol_b,nudge_b,pitch_b,master

[tab BROWSER]
frame x=36 y=88 w=1207 h=624 title=""
readout cx=500 cy=124 w=900 h=40 label="" key=lib_info
list x=50 y=156 w=900 h=490 cols=1 rows=8 th=56 gap=6 key=row
readout cx=640 cy=682 w=1180 h=40 label="" key=status
knob cx=1100 cy=230 r=48 label="TRACK" key=track
button cx=1100 cy=390 label="  LOAD A  " key=load_a
button cx=1100 cy=480 label="  LOAD B  " key=load_b
button cx=1100 cy=600 label="  RESCAN  " key=rescan
qlinks "BROWSER" = track

[tab SOURCE]
frame x=36 y=88 w=1207 h=624 title=""
stepper cx=500 cy=128 w=900 h=52 label="" key=drive
readout cx=500 cy=184 w=900 h=40 label="" key=path
list x=50 y=214 w=900 h=366 cols=1 rows=6 th=56 gap=6 key=fold
readout cx=640 cy=622 w=1180 h=40 label="" key=sources
readout cx=640 cy=672 w=1180 h=40 label="" key=status
knob cx=1100 cy=200 r=48 label="FOLDER" key=folder
button cx=1100 cy=345 label="   OPEN   " key=open
button cx=1100 cy=420 label="    UP    " key=up
button cx=1100 cy=495 label="  USE FOLDER  " key=use
button cx=1100 cy=570 label="  REMOVE  " key=remove
qlinks "SOURCE" = drive,folder

[tab SETUP]
frame x=36 y=88 w=1207 h=624 title=""
